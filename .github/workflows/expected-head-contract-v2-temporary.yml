name: Temporary Expected Head Contract Patch v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/expected-head-contract-v2-temporary.yml"

permissions:
  contents: write

concurrency:
  group: expected-head-contract-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/expected-pr-head-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.11

      - name: Wire expected-head contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def expression(value: str) -> str:
              return "$" + "{{ " + value + " }}"

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_before(path: str, marker: str, addition: str) -> None:
              replace_once(path, marker, addition + marker)

          def insert_after(path: str, marker: str, addition: str) -> None:
              replace_once(path, marker, marker + addition)

          def replace_section(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(start) != 1 or text.count(end) < 1:
                  raise SystemExit(f"{path}: section markers are missing or ambiguous")
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              file.write_text(
                  text[:start_index] + replacement + text[end_index:],
                  encoding="utf-8",
              )

          main_input = (
              "  expected_head_sha:\n"
              "    description: \"Optional full PR head SHA. When set, fail if live PR metadata differs; review and security detach this exact commit from the caller checkout.\"\n"
              "    required: false\n"
              "    default: \"\"\n"
          )
          standalone_input = (
              "  expected_head_sha:\n"
              "    description: \"Optional full PR head SHA that this invocation must consume\"\n"
              "    required: false\n"
              "    default: \"\"\n"
          )

          insert_before("action.yml", "  droid_args:\n", main_input)
          override = "        OVERRIDE_GITHUB_TOKEN: " + expression("inputs.github_token") + "\n"
          insert_after(
              "action.yml",
              override,
              "        EXPECTED_HEAD_SHA: " + expression("inputs.expected_head_sha") + "\n",
          )

          for path in ("review/action.yml", "security/action.yml"):
              insert_before(path, "  tracking_comment_id:\n", standalone_input)
              token = "        GITHUB_TOKEN: " + expression("steps.token.outputs.github_token") + "\n"
              insert_after(
                  path,
                  token,
                  "        EXPECTED_HEAD_SHA: " + expression("inputs.expected_head_sha") + "\n",
              )

          insert_before("prepare/action.yml", "  automatic_review:\n", standalone_input)
          prepare_token = "        OVERRIDE_GITHUB_TOKEN: " + expression("inputs.github_token") + "\n"
          insert_after(
              "prepare/action.yml",
              prepare_token,
              "        EXPECTED_HEAD_SHA: " + expression("inputs.expected_head_sha") + "\n",
          )

          replace_once(
              "src/tag/commands/review.ts",
              'import { execSync } from "child_process";\n',
              'import { checkoutPullRequestHead } from "../../github/validation/expected-head";\n',
          )
          replace_section(
              "src/tag/commands/review.ts",
              "  // Checkout the PR branch before computing diff\n",
              "  // Pre-compute review artifacts",
              """  // Pin review inputs to the authorized PR head when supplied.
          console.log(
            `Checking out PR #${context.entityNumber} head for diff computation...`,
          );
          try {
            const checkedOutHead = checkoutPullRequestHead({
              prData,
              prNumber: context.entityNumber,
              githubToken,
            });
            console.log(`Checked out review head: ${checkedOutHead}`);
          } catch (error) {
            console.error(`Failed to checkout PR head: ${error}`);
            throw new Error(
              `Failed to checkout PR #${context.entityNumber} head for review`,
            );
          }

          """,
          )

          replace_once(
              "src/tag/commands/security-review.ts",
              'import { execSync } from "child_process";\n',
              'import { checkoutPullRequestHead } from "../../github/validation/expected-head";\n',
          )
          replace_section(
              "src/tag/commands/security-review.ts",
              "  // Checkout the PR branch before computing diff\n",
              "  // Pre-compute review artifacts",
              """  // Pin review inputs to the authorized PR head when supplied.
          console.log(
            `Checking out PR #${context.entityNumber} head for diff computation...`,
          );
          try {
            const checkedOutHead = checkoutPullRequestHead({
              prData,
              prNumber: context.entityNumber,
              githubToken,
            });
            console.log(`Checked out security-review head: ${checkedOutHead}`);
          } catch (error) {
            console.error(`Failed to checkout PR head: ${error}`);
            throw new Error(
              `Failed to checkout PR #${context.entityNumber} head for security review`,
            );
          }

          """,
          )

          replace_once(
              "src/tag/commands/fill.ts",
              'import { fetchPRBranchData } from "../../github/data/pr-fetcher";\n',
              'import { fetchPRBranchData } from "../../github/data/pr-fetcher";\nimport { assertExpectedHead } from "../../github/validation/expected-head";\n',
          )
          insert_before(
              "src/tag/commands/fill.ts",
              "  const branchInfo = {\n",
              "  assertExpectedHead(prData);\n\n",
          )

          replace_once(
              "src/entrypoints/generate-review-prompt.ts",
              'import { execSync } from "child_process";\n',
              'import { checkoutPullRequestHead } from "../github/validation/expected-head";\n',
          )
          replace_section(
              "src/entrypoints/generate-review-prompt.ts",
              "    // Checkout the PR branch before computing diff to ensure HEAD points\n",
              "    const reviewArtifacts",
              """    // Pin review inputs to the authorized PR head when supplied.
          console.log(
            `Checking out PR #${context.entityNumber} head for diff computation...`,
          );
          try {
            const checkedOutHead = checkoutPullRequestHead({
              prData,
              prNumber: context.entityNumber,
              githubToken,
            });
            console.log(`Checked out review head: ${checkedOutHead}`);
          } catch (error) {
            console.error(`Failed to checkout PR head: ${error}`);
            throw new Error(
              `Failed to checkout PR #${context.entityNumber} head for review`,
            );
          }

          """,
          )
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, type-check, and test
        run: |
          set -euo pipefail
          bunx prettier --write \
            action.yml \
            prepare/action.yml \
            review/action.yml \
            security/action.yml \
            src/github/validation/expected-head.ts \
            src/tag/commands/review.ts \
            src/tag/commands/security-review.ts \
            src/tag/commands/fill.ts \
            src/entrypoints/generate-review-prompt.ts \
            test/github/validation/expected-head.test.ts \
            docs/expected-head.md
          bunx prettier --check \
            action.yml \
            prepare/action.yml \
            review/action.yml \
            security/action.yml \
            src/github/validation/expected-head.ts \
            src/tag/commands/review.ts \
            src/tag/commands/security-review.ts \
            src/tag/commands/fill.ts \
            src/entrypoints/generate-review-prompt.ts \
            test/github/validation/expected-head.test.ts \
            docs/expected-head.md
          bun run typecheck
          bun test test/github/validation/expected-head.test.ts
          bun test

      - name: Commit verified candidate and remove temporary workflows
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/expected-head-contract-temporary.yml
          rm .github/workflows/expected-head-contract-v2-temporary.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(review): bind invocations to an expected PR head"
          git push origin "HEAD:${HEAD_REF}"
