name: Reconciliation Proof

on:
  push:
    branches: [fix/security-review-per-head-and-safe-debug]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.11
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Show formatting delta
        shell: bash
        run: |
          set -euo pipefail
          bunx prettier --write src/tag/index.ts
          git diff -- src/tag/index.ts
          git diff --exit-code -- src/tag/index.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Assert debug upload is opt-in and sanitized
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'upload_debug_artifacts:' action.yml
          grep -Fq "inputs.upload_debug_artifacts == 'true'" action.yml
          grep -Fq 'droid-debug-sanitized' action.yml
          ! grep -Fq 'name: droid-review-debug-${{ github.run_id }}' action.yml
          ! grep -Fq 'path: ${{ runner.temp }}/.factory/**' action.yml
