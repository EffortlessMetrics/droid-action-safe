name: Restore Expected Head Proof

on:
  push:
    branches: [fix/security-review-per-head-and-safe-debug]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/security-review-per-head-and-safe-debug
          fetch-depth: 1
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.11
      - name: Restore expected-head public input and prepare env
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('action.yml')
          text = path.read_text()

          input_anchor = '''  github_token:\n    description: "GitHub token with repo and pull request permissions (optional if using GitHub App)"\n    required: false\n\n  droid_args:\n'''
          input_replacement = '''  github_token:\n    description: "GitHub token with repo and pull request permissions (optional if using GitHub App)"\n    required: false\n\n  expected_head_sha:\n    description: "Optional full PR head SHA. When set, fail if live PR metadata differs; review and security detach this exact commit from the caller checkout."\n    required: false\n    default: ""\n  droid_args:\n'''
          if text.count(input_anchor) != 1:
              raise SystemExit('expected exactly one github_token/droid_args input anchor')
          text = text.replace(input_anchor, input_replacement, 1)

          expr_open = '$' + '{{'
          expr_close = '}}'
          env_anchor = (
              '        OVERRIDE_GITHUB_TOKEN: ' + expr_open + ' inputs.github_token ' + expr_close + '\n'
              '        ALLOWED_BOTS: ' + expr_open + ' inputs.allowed_bots ' + expr_close + '\n'
          )
          env_replacement = (
              '        OVERRIDE_GITHUB_TOKEN: ' + expr_open + ' inputs.github_token ' + expr_close + '\n'
              '        EXPECTED_HEAD_SHA: ' + expr_open + ' inputs.expected_head_sha ' + expr_close + '\n'
              '        ALLOWED_BOTS: ' + expr_open + ' inputs.allowed_bots ' + expr_close + '\n'
          )
          if text.count(env_anchor) != 1:
              raise SystemExit('expected exactly one prepare token env anchor')
          text = text.replace(env_anchor, env_replacement, 1)

          path.write_text(text)
          PY
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Assert reconciled controls
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'expected_head_sha:' action.yml
          expected_env='EXPECTED_HEAD_SHA: $'"{{ inputs.expected_head_sha }}"
          grep -Fq "$expected_env" action.yml
          grep -Fq 'upload_debug_artifacts:' action.yml
          grep -Fq "inputs.upload_debug_artifacts == 'true'" action.yml
          grep -Fq 'droid-debug-sanitized' action.yml
          ! grep -Fq 'path: ${{ runner.temp }}/.factory/**' action.yml
      - name: Commit tested final tree and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-expected-head-proof.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add action.yml .github/workflows/restore-expected-head-proof.yml
          git commit -m 'fix(review): restore expected-head action input'
          git push origin HEAD:fix/security-review-per-head-and-safe-debug
