name: Settings Security Proof

on:
  push:
    branches: [fix/secret-safe-settings]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/secret-safe-settings
          fetch-depth: 1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.11
      - run: bun install --frozen-lockfile
      - name: Format edited files
        run: bunx prettier --write base-action/src/setup-droid-settings.ts base-action/test/setup-droid-settings.test.ts
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test base-action/test/setup-droid-settings.test.ts
      - run: bun test
      - name: Commit tested final source and remove proof workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/settings-proof.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add base-action/src/setup-droid-settings.ts base-action/test/setup-droid-settings.test.ts .github/workflows/settings-proof.yml
          git commit -m 'style(security): format secret-safe settings'
          git push origin HEAD:fix/secret-safe-settings
